<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMC • Global Top 50</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#050505;color:#fff;}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;background:#0b0b0b;border-bottom:1px solid #222;}
.logo{color:#FFD400;font-size:28px;font-weight:900;}
a{color:#fff;text-decoration:none;margin-left:20px;}
.container{width:90%;max-width:1100px;margin:40px auto;}
h1{font-size:42px;margin-bottom:10px;}
.subtitle{color:#999;margin-bottom:30px;}
.row{
display:grid;
grid-template-columns:60px 55px 1fr 80px;
gap:15px;
align-items:center;
padding:14px;
margin-bottom:10px;
background:#111;
border:1px solid #222;
border-radius:15px;
}
.rank{font-size:22px;font-weight:bold;color:#FFD400;}
.thumb{width:50px;height:50px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;}
.song{font-weight:bold;}
.artist{color:#888;font-size:14px;}
.trend{font-size:20px;text-align:right;}
</style>
</head>
<body>

<nav>
<div class="logo">GMC.</div>
<div>
<a href="../index.html">Home</a>
<a href="../arena.html">Arena</a>
</div>
</nav>

<div class="container">
<h1>Global Top 50</h1>
<p class="subtitle">Live rankings powered by GMC.</p>

<div id="chart-list"></div>

</div>

<script>
const API="http://127.0.0.1:8000";

async function loadChart(){

const res=await fetch(`${API}/api/charts/global/top10`);
const songs=await res.json();

const chart=document.getElementById("chart-list");
chart.innerHTML="";

songs.forEach(song=>{

const trend={
up:"📈",
down:"📉",
steady:"➡️"
}[song.trend];

chart.innerHTML+=`
<div class="row">
<div class="rank">${song.rank}</div>
<div class="thumb">${song.artist.charAt(0)}</div>
<div>
<div class="song">${song.song}</div>
<div class="artist">${song.artist}</div>
</div>
<div class="trend">${trend}</div>
</div>`;
});
}

loadChart();
</script>

</body>
</html>
